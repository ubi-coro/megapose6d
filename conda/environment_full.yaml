name: megapose
channels:
  - conda-forge
  - pytorch
  - anaconda
  - defaults
dependencies:
  - python=3.9
  - numpy<2
  - pip
  - wget
  - python-wget
  - joblib
  # Keep the torch stack exactly aligned with MegaPose-tested conda-forge builds.
  - conda-forge::pytorch==1.11.0
  - conda-forge::torchvision==0.12.0
  - conda-forge::cudatoolkit==11.3.1
  - ipython
  - ipykernel
  - jupyterlab
  - notebook
  - nb_conda_kernels
  # Legacy Notebook 6 extension pack; incompatible with modern notebook 7 stack.
  # - jupyter_contrib_nbextensions
  - pinocchio
  - rclone
  - pillow
  - ipywidgets
  - selenium
  - geckodriver
  - firefox
  - pip:
      # Keep pip from dragging in a newer torch ABI by pinning known-good companions.
      - kornia==0.6.9
      - torchgeometry==0.1.2
      - torchnet==0.0.4
      - meshcat
      - selenium
      - omegaconf
      - simplejson
      - line_profiler 
      - opencv-python==4.11.0.86
      - tqdm
      - lxml
      - transforms3d
      - panda3d
      - joblib
      - xarray 
      - pandas
      - matplotlib
      - bokeh
      - plyfile 
      - trimesh 
      - ipdb 
      - panda3d-gltf
      - colorama
      - pyyaml
      - ipykernel
      - scipy
      - pypng
      - h5py 
      - seaborn
      - pyarrow 
      - dt_apriltags 
      - open3d
      - structlog
      - imageio
      - progressbar
      - pyyaml
      - psutil
      - webdataset
      - opencv-contrib-python==4.11.0.86
      - roma 
